name: Go Project CI

concurrency:
  group: ci-workflow-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - "*"

env:
  SERVICE: tradinglib

jobs:
  lint:
    uses: KyberNetwork/service-framework/.github/workflows/lint-v2.yaml@main
    with:
      runs-on: ubuntu-latest
      version: v2.14.0
      args: --config=.golangci.yml --timeout=10m
    secrets: inherit
