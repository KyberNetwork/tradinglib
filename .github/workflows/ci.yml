name: Go Project CI

concurrency:
  group: ci-workflow-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - ci
  pull_request:
    branches:
      - "*"

env:
  SERVICE: tradinglib

jobs:
  placeholder:
    runs-on: ubuntu-latest
    steps:
      - name: Report disabled checks
        run: echo "Lint and test jobs are disabled."
